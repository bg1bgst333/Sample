<html>
  <head>
    <title>arithmetic_operators</title>
  </head>
  <body>
    <script type="text/javascript">
      const a = 10;
      const b = 3;
      window.alert(
        (a + b) + "\n" +
        (a - b) + "\n" +
        (a * b) + "\n" +
        (a / b) + "\n" +
        (a % b)
      );
    </script>
  </body>
</html>
