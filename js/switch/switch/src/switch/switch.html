<html>
  <head>
    <title>switch</title>
  </head>
  <body>
    <script type="text/javascript">
      const x = 1;
      switch (x){
        case 0:
          window.alert("x is 0");
          break;
        case 1:
          window.alert("x is 1");
          break;
        default:
          window.alert("x is other");
          break;
      }
    </script>
  </body>
</html>
