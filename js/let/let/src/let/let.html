<html>
  <head>
    <title>let</title>
  </head>
  <body>
    <script type="text/javascript">
      if (true) {
        var x = 10;
      }
      window.alert(x);
      if (true) {
        let y = 20;
      }
      try {
        window.alert(y);
      } catch(e) {
        window.alert(e.message);
      }
    </script>
  </body>
</html>
