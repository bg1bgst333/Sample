<html>
  <head>
    <title>if</title>
  </head>
  <body>
    <script type="text/javascript">
      const x = 10;
      if (x > 5){
        window.alert("x is greater than 5");
      }
      else if (x === 5){
        window.alert("x is 5");
      }
      else{
        window.alert("x is less than 5");
      }
    </script>
  </body>
</html>
